async function verifierGainsDisponibles(){
  const user = auth.currentUser;
  if (!user) return false;
  try {
    const buysRef = collection(fs, "users", user.uid, "buys");
    const snap = await getDocs(buysRef);
    if (snap.empty) return false;
    const now = Date.now();
    const msPerDay = 86400000;
    for (const d of snap.docs) {
      const buyData = d.data();
      const createdAt = buyData.createdAt || now;
      const lastClaim = buyData.lastClaim || createdAt;
      const daysPaid = buyData.daysPaid || 0;
      const maxDays = buyData.days;
      if (daysPaid >= maxDays) continue;
      const daysElapsed = Math.floor((now - lastClaim) / msPerDay);
      if (daysElapsed > 0) return true;
    }
    return false;
  } catch {
    return false;
  }
}

window.checkAndUpdateButton = async function(){
  hasGainsAvailable = await verifierGainsDisponibles();
  const btn = document.getElementById("btn-reclamer");
  const msgEl = document.getElementById("gain-msg");
  if (btn) btn.disabled = !hasGainsAvailable;
  if (msgEl) {
    if (hasGainsAvailable) {
      msgEl.style.color = "var(--pr)";
      msgEl.textContent = "✨ Des gains sont disponibles !";
    } else {
      msgEl.style.color = "var(--mu)";
      msgEl.textContent = "⏰ Revenez demain matin pour réclamer";
    }
  }
};

window.reclamerMesGains = async function() {
  const user = auth.currentUser;
  if (!user) return;
  const msgEl = document.getElementById("gain-msg");
  const btn = document.getElementById("btn-reclamer");
  if (btn) btn.disabled = true;
  if (msgEl) msgEl.textContent = "Calcul en cours...";

  try {
    const buysRef = collection(fs, "users", user.uid, "buys");
    const snap = await getDocs(buysRef);
    if (snap.empty) {
      if (msgEl) msgEl.textContent = "Vous n'avez aucun sac d'investissement actif.";
      hasGainsAvailable = false;
      return;
    }

    let totalGain = 0;
    const now = Date.now();
    const msPerDay = 86400000;

    for (const d of snap.docs) {
      const buyData = d.data();
      const createdAt = buyData.createdAt || now;
      const lastClaim = buyData.lastClaim || createdAt;
      const daysPaid = buyData.daysPaid || 0;
      const maxDays = buyData.days;
      if (daysPaid >= maxDays) continue;
      const daysElapsed = Math.floor((now - lastClaim) / msPerDay);
      if (daysElapsed > 0) {
        const daysToPay = Math.min(daysElapsed, maxDays - daysPaid);
        const gain = daysToPay * buyData.d;
        totalGain += gain;
        await updateDoc(doc(fs, "users", user.uid, "buys", d.id), {
          daysPaid: daysPaid + daysToPay,
          lastClaim: lastClaim + (daysToPay * msPerDay)
        });
      }
    }

    if (totalGain > 0) {
      await runTransaction(fs, async t => {
        const uRef = doc(fs, "users", user.uid);
        const uSnap = await t.get(uRef);
        const curBal = uSnap.data().bal || 0;
        t.update(uRef, { bal: curBal + totalGain });
      });
      if (msgEl) {
        msgEl.style.color = "var(--pr)";
        msgEl.textContent = `🎉 +${F(totalGain)} ajouté à votre solde !`;
      }
    } else {
      if (msgEl) {
        msgEl.style.color = "var(--mu)";
        msgEl.textContent = "🔒 Pas encore de gains. Revenez demain matin.";
      }
    }
    hasGainsAvailable = false;
  } catch (e) {
    if (msgEl) {
      msgEl.style.color = "var(--er)";
      msgEl.textContent = "Erreur : " + e.message;
    }
    hasGainsAvailable = true;
  }
  setTimeout(() => checkAndUpdateButton(), 30000);
};

window.buy = async function(idx) {
  const item = VIP[idx];
  const user = auth.currentUser;
  if (!user) return;
  try {
    await runTransaction(fs, async t => {
      const uRef = doc(fs, "users", user.uid);
      const uSnap = await t.get(uRef);
      const curBal = uSnap.data().bal || 0;
      if (curBal < item.p) throw new Error("Solde insuffisant pour acheter ce sac.");
      t.update(uRef, { bal: curBal - item.p });
    });
    const now = Date.now();
    await addDoc(collection(fs, "users", user.uid, "buys"), {
      n: item.n, p: item.p, d: item.d, days: item.days,
      t: D(), createdAt: now, lastClaim: now, daysPaid: 0

  }
};

achats:()=>{const b=U().buys;return`<h2>Mes achats</h2>`+(b.length?b.map(x=>`<div class="card">
  <div class="row"><b>${x.n}</b><span class="tag" style="background:rgba(16,185,129,0.2);color:var(--wa)">${(x.daysPaid||0) >= x.days ? 'Terminé' : 'Actif'}</span></div>
  <div class="mu">Investi : ${F(x.p)} · ${F(x.d)}/jour · Retiré: ${x.daysPaid||0}/${x.days} jours<br>Acheté le ${x.t}</div>
</div>`).join(""):`<p class="mu">Aucun achat pour le moment.</p>`)},

team:()=>{
  const u=U();
  const myRefCode = u.phone || "";
  const fullRefLink = BASE_REF_LINK + "?ref=" + myRefCode;
  return `<h2>Mon équipe</h2>
  <div class="card">
    <p class="mu">Votre lien de parrainage personnel :</p>
    <input type="text" readonly value="${fullRefLink}" id="refLinkInput" style="font-size:12px;background:var(--bg);">
    <button class="btn sec" onclick="copyLink('${fullRefLink}')">Copier le lien</button>
    <p class="mu" style="margin-top:12px;">Gagnez 600 F lorsque vos filleuls effectuent leur première recharge !</p>
    <hr style="border-color:var(--bd);margin:12px 0">
    <p class="mu">Membres invités dans votre équipe : <b>${teamN}</b></p>
  </div>`;
},

account:()=>{const u=U();return`<h2>Mon compte</h2><div class="card"><b>${esc(u.name)}</b><div class="mu">${esc(u.phone)} · Solde ${F(u.bal)}</div></div>`+[["team","Équipe & Parrainage"],["histRec","Historique des recharges"],["histRet","Historique des retraits"],["achats","Mes achats"],["link","Lier mon compte de retrait"],["service","Service client"]].map(x=>`<button class="li" onclick="go('${x[0]}')">${x[1]} <span>›</span></button>`).join("")+`<button class="btn out" onclick="logout()">Se déconnecter</button>`},
recharge:()=>`${back()}<h2>Recharger</h2><div class="card"><label>Montant (minimum 1 000 F)</label><input id="a" type="number" inputmode="numeric" value="${T.amt||""}"><div class="chips">${[5000,10000,30000,50000,100000].map(v=>`<button onclick="a.value=${v}">${v.toLocaleString("fr-FR")}</button>`).join("")}</div><div id="err" class="err"></div><button class="btn" onclick="toMethod()">Confirmer</button></div>`,

method:()=>`${back("recharge")}<h2>Choisir la méthode</h2><p class="mu">Montant : <b>${F(T.amt)}</b></p>`+
  `<button class="li wave" onclick="go('payWave')"><b>Wave</b><span>›</span></button>`+
  `<button class="li" style="border: 2px solid #ffcc00;" onclick="go('payMTN')"><b>MTN Money</b><span>›</span></button>`+
  `<button class="li" style="border: 2px solid #00a859;" onclick="go('payMoov')"><b>Moov Money</b><span>›</span></button>`,

payWave:()=>`${back("method")}<h2>Paiement Wave</h2><div class="card"><p class="mu">Envoyez <b>${F(T.amt)}</b> sur le numéro Wave suivant :</p><div class="row" style="margin-bottom:12px"><span class="num">${WAVE_NUM}</span><button class="btn btn-sm" onclick="copyN('${WAVE_NUM}')">Copier</button></div><label>Votre numéro Wave</label><input id="pn" type="tel"><label>ID de transaction</label><input id="tx"><div id="err" class="err"></div><button class="btn" onclick="confirmPay('Wave')">J'ai payé</button></div>`,
payMTN:()=>`${back("method")}<h2>Paiement MTN Money</h2><div class="card"><p class="mu">Envoyez <b>${F(T.amt)}</b> sur le numéro MTN suivant :</p><div class="row" style="margin-bottom:12px"><span class="num">${MTN_NUM}</span><button class="btn btn-sm" onclick="copyN('${MTN_NUM}')">Copier</button></div><label>Votre numéro MTN</label><input id="pn" type="tel"><label>ID de transaction</label><input id="tx"><div id="err" class="err"></div><button class="btn" onclick="confirmPay('MTN Money')">J'ai payé</button></div>`,
payMoov:()=>`${back("method")}<h2>Paiement Moov Money</h2><div class="card"><p class="mu">Envoyez <b>${F(T.amt)}</b> sur le numéro Moov suivant :</p><div class="row" style="margin-bottom:12px"><span class="num">${MOOV_NUM}</span><button class="btn btn-sm" onclick="copyN('${MOOV_NUM}')">Copier</button></div><label>Votre numéro Moov</label><input id="pn" type="tel"><label>ID de transaction</label><input id="tx"><div id="err" class="err"></div><button class="btn" onclick="confirmPay('Moov Money')">J'ai payé</button></div>`,

withdraw:()=>`${back()}<h2>Retirer des fonds</h2><div class="card"><label>Montant (minimum 1 000 F)</label><input id="a" type="number" inputmode="numeric"><label>Numéro de réception</label><input id="pn" type="tel"><div id="err" class="err"></div><button class="btn" onclick="doWd()">Valider le retrait</button></div>`,
histRec:()=>`${back()}<h2>Historique des recharges</h2>`+hist(recs,"Aucune recharge pour le moment."),
histRet:()=>`${back()}<h2>Historique des retraits</h2>`+hist(rets,"Aucun retrait pour le moment."),
service:()=>`${back()}<h2>Service client</h2><div class="card" style="text-align:center"><p class="mu">Besoin d'aide ? Contactez notre support sur WhatsApp.</p><a class="btn" href="${SUPPORT}" target="_blank">Ouvrir le support WhatsApp</a></div>`,
link:()=>`${back()}<h2>Lier mon compte de retrait</h2><div class="card"><label>Méthode</label><select id="m">${METH.map(m=>`<option>${m}</option>`).join("")}</select><label>Numéro de téléphone</label><input id="pn" type="tel"><div id="err" class="err"></div><button class="btn" onclick="doLink()">Enregistrer</button></div>`,
card:()=>`${back()}<h2>Compte lié</h2><div class="card"><p class="mu">Compte enregistré avec succès.</p><button class="btn sec" onclick="go('link')">Modifier</button></div>`
};

function render(){
  const app=document.getElementById("app"),nav=document.getElementById("nav");
  if(!auth.currentUser){
    app.innerHTML=(pages[P]||pages.signup)();
    nav.innerHTML="";
    return;
  }
  if(["signup","login"].includes(P)) P="home";
  app.innerHTML=(pages[P]||pages.home)();
  nav.innerHTML=[
    ["home","🏠","Accueil"],
    ["invest","📈","Investir"],
    ["achats","📦","Achats"],
    ["team","👥","Équipe"],
    ["account","👤","Compte"]
  ].map(x=>`<button class="${P==x[0]?"on":""}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join("");
}

onAuthStateChanged(auth,user=>{
  unsubs.forEach(u=>u());unsubs=[];
  if(user){
    unsubs.push(onSnapshot(doc(fs,"users",user.uid),async d=>{
      ud=d.data()||{};
      checkAndUpdateButton();
      render();
    }));
    unsubs.push(onSnapshot(collection(fs,"users",user.uid,"recs"),s=>{recs=s.docs.map(x=>x.data());if(P=="histRec")render();}));
    unsubs.push(onSnapshot(collection(fs,"users",user.uid,"rets"),s=>{rets=s.docs.map(x=>x.data());if(P=="histRet")render();}));
    unsubs.push(onSnapshot(collection(fs,"users",user.uid,"buys"),s=>{buys=s.docs.map(x=>x.data());if(["home","achats"].includes(P))render();}));
  } else {
    ud=null;recs=[];rets=[];buys=[];teamN=0;
    render();
  }
});
render();
</script>
</body>
</html>
