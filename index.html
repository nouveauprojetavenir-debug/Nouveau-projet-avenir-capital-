async function verifierGainsDisponibles(){
  const user = auth.currentUser;
  if (!user) return false;
  try {
    const buysRef = collection(fs, "users", user.uid, "buys");
    const snap = await getDocs(buysRef);
    if (snap.empty) return false;
    const now = Date.now();
    const msPerDay = 86400000;
    for (const d of snap.docs) {
      const buyData = d.data();
      const createdAt = buyData.createdAt || now;
      const lastClaim = buyData.lastClaim || createdAt;
      const daysPaid = buyData.daysPaid || 0;
      const maxDays = buyData.days;
      if (daysPaid >= maxDays) continue;
      const daysElapsed = Math.floor((now - lastClaim) / msPerDay);
      if (daysElapsed > 0) return true;
    }
    return false;
  } catch {
    return false;
  }
}

window.checkAndUpdateButton = async function(){
  hasGainsAvailable = await verifierGainsDisponibles();
  const btn = document.getElementById("btn-reclamer");
  const msgEl = document.getElementById("gain-msg");
  if (btn) btn.disabled = !hasGainsAvailable;
  if (msgEl) {
    if (hasGainsAvailable) {
      msgEl.style.color = "var(--pr)";
      msgEl.textContent = "✨ Des gains sont disponibles !";
    } else {
      msgEl.style.color = "var(--mu)";
      msgEl.textContent = "⏰ Revenez demain matin pour réclamer";
    }
  }
};

window.reclamerMesGains = async function() {
  const user = auth.currentUser;
  if (!user) return;
  const msgEl = document.getElementById("gain-msg");
  const btn = document.getElementById("btn-reclamer");
  if (btn) btn.disabled = true;
  if (msgEl) msgEl.textContent = "Calcul en cours...";

  try {
    const buysRef = collection(fs, "users", user.uid, "buys");
    const snap = await getDocs(buysRef);
    if (snap.empty) {
      if (msgEl) msgEl.textContent = "Vous n'avez aucun sac d'investissement actif.";
      hasGainsAvailable = false;
      return;
    }

    let totalGain = 0;
    const now = Date.now();
    const msPerDay = 86400000;

    for (const d of snap.docs) {
      const buyData = d.data();
      const createdAt = buyData.createdAt || now;
      const lastClaim = buyData.lastClaim || createdAt;
      const daysPaid = buyData.daysPaid || 0;
      const maxDays = buyData.days;
      if (daysPaid >= maxDays) continue;
      const daysElapsed = Math.floor((now - lastClaim) / msPerDay);
      if (daysElapsed > 0) {
        const daysToPay = Math.min(daysElapsed, maxDays - daysPaid);
        const gain = daysToPay * buyData.d;
        totalGain += gain;
        await updateDoc(doc(fs, "users", user.uid, "buys", d.id), {
          daysPaid: daysPaid + daysToPay,
          lastClaim: lastClaim + (daysToPay * msPerDay)
        });
      }
    }

    if (totalGain > 0) {
      await runTransaction(fs, async t => {
        const uRef = doc(fs, "users", user.uid);
        const uSnap = await t.get(uRef);
        const curBal = uSnap.data().bal || 0;
        t.update(uRef, { bal: curBal + totalGain });
      });
      if (msgEl) {
        msgEl.style.color = "var(--pr)";
        msgEl.textContent = `🎉 +${F(totalGain)} ajouté à votre solde !`;
      }
    } else {
      if (msgEl) {
        msgEl.style.color = "var(--mu)";
        msgEl.textContent = "🔒 Pas encore de gains. Revenez demain matin.";
      }
    }
    hasGainsAvailable = false;
  } catch (e) {
    if (msgEl) {
      msgEl.style.color = "var(--er)";
      msgEl.textContent = "Erreur : " + e.message;
    }
    hasGainsAvailable = true;
  }
  setTimeout(() => checkAndUpdateButton(), 30000);
};

window.buy = async function(idx) {
  const item = VIP[idx];
  const user = auth.currentUser;
  if (!user) return;
  try {
    await runTransaction(fs, async t => {
      const uRef = doc(fs, "users", user.uid);
      const uSnap = await t.get(uRef);
      const curBal = uSnap.data().bal || 0;
      if (curBal < item.p) throw new Error("Solde insuffisant pour acheter ce sac.");
      t.update(uRef, { bal: curBal - item.p });
    });
    const now = Date.now();
    await addDoc(collection(fs, "users", user.uid, "buys"), {
      n: item.n, p: item.p, d: item.d, days: item.days,
      t: D(), createdAt: now, lastClaim: now, daysPaid: 0
    });
    alert("✅ Achat du " + item.n + " réussi !");
    setTimeout(() => checkAndUpdateButton(), 500);
    go("achats");
  } catch (e) {
    err(e.message);
  }
};

        <div class="row"><b>${b.n}</b><span class="tag">Actif</span></div>
        <p class="mu">Acheté le : ${b.t}<br>Investissement : ${F(b.p)}<br>Revenu/jour : ${F(b.d)}<br>Jours payés : ${b.daysPaid || 0} / ${b.days}</p>
      </div>`).join("") : `<p class="mu" style="text-align:center;">Vous n'avez pas encore acheté de sacs d'investissement.</p>`);
  },

  recharge:()=>`${back()}<h2>Recharger le compte</h2>
  <div class="card">
    <label>Montant en FCFA (Min. 1 000 F)</label>
    <input id="a" type="number" placeholder="Ex: 5000">
    <div id="err" class="err"></div>
    <button class="btn" onclick="toMethod()">Continuer</button>
    <div style="margin-top: 15px; text-align: center;">
      <p class="mu" style="margin-bottom: 8px;">Ou effectuez un paiement direct sécurisé via Jeko :</p>
      <a class="btn btn-gold" href="${PAY_LINK}" target="_blank">Payer via Jeko 🌐</a>
    </div>
  </div>`,

  method:()=>`${back()}<h2>Choisissez le mode de paiement</h2>
  <p class="mu">Montant : <b>${F(T.amt)}</b></p>
  ${METH.map(m=>`<button class="li" onclick="go('payDetails',{m:'${m}'})">${m} <span>›</span></button>`).join("")}`,

  payDetails:()=>{
    const num = T.m === "Wave" ? WAVE_NUM : (T.m === "Moov Money" ? MOOV_NUM : MTN_NUM);
    return `${back()}<h2>Paiement ${T.m}</h2>
    <div class="card">
      <p class="mu">Veuillez transférer exactement <b>${F(T.amt)}</b> sur le numéro suivant :</p>
      <div class="num" style="margin:12px 0; color:var(--pr);">${num}</div>
      <button class="btn sec" onclick="copyN('${num}')">Copier le numéro</button>
      <hr style="border-color:var(--bd);margin:16px 0">
      <label>Votre numéro de téléphone (expéditeur)</label><input id="pn" type="tel">
      <label>ID de transaction / Référence</label><input id="tx">
      <div id="err" class="err"></div>
      <button class="btn" onclick="confirmPay('${T.m}')">J'ai effectué le paiement</button>
    </div>`;
  },

  withdraw:()=>`${back()}<h2>Retirer des fonds</h2>
  <div class="card">
    <label>Montant du retrait (Min. 1 000 F)</label><input id="a" type="number">
    <label>Votre numéro de réception</label><input id="pn" type="tel">
    <div id="err" class="err"></div>
    <button class="btn" onclick="doWd()">Valider le retrait</button>
  </div>`,

  card:()=>{
    const u = U();
    const curM = u.card ? u.card.m : METH[0];
    const curNum = u.card ? u.card.num : '';
    return `${back()}<h2>Lier le Portefeuille de Retrait</h2>
    <div class="card">
      <label>Méthode de paiement</label>
      <select id="m">
        ${METH.map(m => `<option ${m===curM?'selected':''}>${m}</option>`).join("")}
      </select>
      <label>Numéro de compte / téléphone</label>
      <input id="pn" type="tel" value="${curNum}" placeholder="Ex: 0700000000">
      <div id="err" class="err"></div>
      <button class="btn" onclick="doLink()">Enregistrer le portefeuille</button>
    </div>`;
  },

  team:()=>{
    const u = U();
    const refLink = BASE_REF_LINK + "?ref=" + (u.phone || "");
    return `${back()}<h2>Mon Équipe & Parrainage</h2>
    <div class="card" style="text-align:center;">
      <p class="mu">Partagez votre lien d'invitation :</p>
      <input type="text" value="${refLink}" readonly style="text-align:center; font-size:13px;">
      <button class="btn sec" onclick="copyLink('${refLink}')">Copier le lien de parrainage</button>
    </div>`;
  },

  histRec:()=>`${back()}<h2>Historique des Recharges</h2>`+hist(recs,"Aucune recharge pour le moment."),
  histRet:()=>`${back()}<h2>Historique des Retraits</h2>`+hist(rets,"Aucun retrait pour le moment."),

  service:()=>`${back()}<h2>Service Client</h2>
  <div class="card" style="text-align:center;">
    <p class="mu">Besoin d'aide ? Contactez notre support officiel sur WhatsApp.</p>
    <a class="btn" href="${SUPPORT}" target="_blank">Ouvrir le Support WhatsApp 💬</a>
  </div>`
};

function render(){
  const app=document.getElementById("app"),nav=document.getElementById("nav");
  if(!auth.currentUser){
    app.innerHTML=(pages[P]&&P==="signup")?pages.signup():pages.login();
    nav.innerHTML="";
    return;
  }
  app.innerHTML=pages[P]?pages[P]():pages.home();
  if(["home","invest","team","service"].includes(P)){
    nav.innerHTML=`
      <button class="${P==='home'?'on':''}" onclick="go('home')"><span>🏠</span>Accueil</button>
      <button class="${P==='invest'?'on':''}" onclick="go('invest')"><span>📈</span>Investir</button>
      <button class="${P==='team'?'on':''}" onclick="go('team')"><span>👥</span>Équipe</button>
      <button class="${P==='service'?'on':''}" onclick="go('service')"><span>💬</span>Support</button>
    `;
    nav.style.display="flex";
  }else{
    nav.style.display="none";
  }
}

onAuthStateChanged(auth, async u=>{
  unsubs.forEach(fn=>fn());unsubs=[];
  if(u){
    loading=true;
    unsubs.push(onSnapshot(doc(fs,"users",u.uid),d=>{
      ud=d.exists()?d.data():null;
      if(loading){loading=false;go("home");}
      else render();
      checkAndUpdateButton();
    }));
    unsubs.push(onSnapshot(query(collection(fs,"users",u.uid,"recs")),s=>{
      recs=s.docs.map(d=>d.data());
    }));
    unsubs.push(onSnapshot(query(collection(fs,"users",u.uid,"rets")),s=>{
      rets=s.docs.map(d=>d.data());
    }));
    unsubs.push(onSnapshot(query(collection(fs,"users",u.uid,"buys")),s=>{
      buys=s.docs.map(d=>d.data());
    }));
  }else{
    ud=null;recs=[];rets=[];buys=[];
    render();
  }
});

render();
</script>
</body>
</html>
