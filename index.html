button{font:inherit;cursor:pointer}

.btn-gold{background:linear-gradient(135deg,var(--gold),#d97706);color:#fff}
.btn-sm{width:auto;padding:10px 20px;font-size:15px;border-radius:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}

nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:100}

// 🎡 Roue de la fortune avec grosses sommes et crédit automatique
window.tournerRoue = async function() {
  const user = auth.currentUser;
  if (!user) return;
  const resEl = document.getElementById("roue-result");
  const btnEl = document.getElementById("btnRoue");
  if(btnEl) btnEl.disabled = true;

  // Gros lots demandés
  const gainsPossibles = [50000, 100000, 150000, 200000, 350000, 400000];
  const gagne = gainsPossibles[Math.floor(Math.random() * gainsPossibles.length)];

  if(resEl) resEl.textContent = "🌀 La roue tourne vers un gros lot...";

  setTimeout(async () => {
    try {
      // Crédit automatique immédiat dans Firestore
      await runTransaction(fs, async t => {
        const userRef = doc(fs, "users", user.uid);
        const userSnap = await t.get(userRef);
        const currentBal = userSnap.data().bal || 0;
        t.update(userRef, { bal: currentBal + gagne });
      });
      if(resEl) resEl.textContent = `🎉 Jackpot ! Vous avez gagné ${F(gagne)} crédités !`;
      alert(`🎉 Incroyable ! ${F(gagne)} ont été ajoutés directement à votre solde.`);
      render();
    } catch(e) {
      if(resEl) resEl.textContent = "Erreur lors du crédit.";
      if(btnEl) btnEl.disabled = false;
    }
  }, 1500);
};

// ✅ Réclamation automatique des gains journaliers en FCFA selon les jours
window.reclamerMesGains = async function() {
  const user = auth.currentUser;
  if (!user) return;

  const msgEl = document.getElementById("gain-msg");
  if (msgEl) msgEl.textContent = "";

  try {
    const qPurchases = query(collection(fs, "purchases"), where("uid", "==", user.uid));
    const snap = await getDocs(qPurchases);
    
    let gainTotal = 0;
    const now = Date.now();
    const oneDayMs = 24 * 60 * 60 * 1000;

    snap.docs.forEach(docSnap => {
      const p = docSnap.data();
      const startDate = p.ts;
      const lastClaim = p.lastClaim || startDate;
      const maxDays = p.days || 31;
      const totalDaysActive = Math.floor((now - startDate) / oneDayMs);

      if (totalDaysActive < maxDays) {
        const daysToPay = Math.floor((now - lastClaim) / oneDayMs);
        if (daysToPay >= 1) {
          gainTotal += (daysToPay * p.d);
        }
      }
    });

    if (gainTotal === 0) {
      if (msgEl) msgEl.textContent = "Aucun gain journalier disponible pour l'instant. Revenez demain !";
      return;
    }

    await runTransaction(fs, async t => {
      const userRef = doc(fs, "users", user.uid);
      const userSnap = await t.get(userRef);
      const currentBal = userSnap.data().bal || 0;

      t.update(userRef, { bal: currentBal + gainTotal });
      
      for (let i = 0; i < snap.docs.length; i++) {
        const pDoc = snap.docs[i];
        const p = pDoc.data();
        const lastClaim = p.lastClaim || p.ts;
        const daysToPay = Math.floor((now - lastClaim) / oneDayMs);
        if (daysToPay >= 1) {
          const newLastClaim = lastClaim + (daysToPay * oneDayMs);
          t.update(doc(fs, "purchases", pDoc.id), { lastClaim: newLastClaim });
        }
      }
    });

    alert(`✅ Succès ! ${F(gainTotal)} ont été ajoutés à votre solde.`);
    render();
  } catch (e) {
    console.error(e);
    if (msgEl) msgEl.textContent = "Erreur : " + e.message;
  }
};

    const c=await createUserWithEmailAndPassword(auth,em(p),w);

      name:n,

      bal:0,

      ts:Date.now()

}

async function buy(i){
  const v=VIP[i],ref=doc(fs,"users",auth.currentUser.uid);
  try{
    await runTransaction(fs,async t=>{
      const b=(await t.get(ref)).data().bal;
      if(b<v.p)throw{message:"Solde insuffisant. Rechargez votre compte."};
      t.update(ref,{bal:b-v.p});
      t.set(doc(collection(fs,"purchases")),{
        uid:auth.currentUser.uid,
        n:v.n,
        p:v.p,
        d:v.d,
        days:v.days,
        t:D(),
        ts:Date.now(),
        lastClaim:Date.now()
      });
    });
    alert("✅ Investissement confirmé !");
    go("achats");
  }catch(e){err(e.message)}
}

async function confirmPay(mode){
  const p=$("pn"),t=$("tx"),a=T.amt;
  if(a<1000)return err("Montant minimum : 1 000 F.");
  if(p.length<8||t.length<4)return err("Entre ton numéro et l'ID de transaction.");
  try{
    const userSnap = await getDocs(query(collection(fs, "recharges"), where("uid", "==", auth.currentUser.uid)));
    const isFirstRecharge = userSnap.empty;

    await addDoc(collection(fs,"recharges"),{
      uid:auth.currentUser.uid,a:a,m:mode+" · "+esc(p)+" · ID "+esc(t),t:D(),ts:Date.now(),s:"En attente"
    });

    if(isFirstRecharge && ud && ud.ref) {
      const parrainQuery = query(collection(fs, "users"), where("phone", "==", ud.ref));
      const parrainSnap = await getDocs(parrainQuery);
      if(!parrainSnap.empty) {
        const parrainDocSnap = parrainSnap.docs[0];
        const parrainRef = doc(fs, "users", parrainDocSnap.id);
        await runTransaction(fs, async tr => {
          const pData = (await tr.get(parrainRef)).data();
          tr.update(parrainRef, { bal: (pData.bal || 0) + 600 });
        });
      }
    }

    alert("✅ Demande envoyée ! En attente de validation.");
    go("histRec");
  }catch(e){err("Erreur : "+e.message)}
}

async function doWd(){
  const a=+$("a"),p=$("pn"),ref=doc(fs,"users",auth.currentUser.uid);
  if(a<1000)return err("Montant minimum : 1 000 F.");
  if(p.length<8)return err("Entre un numéro valide.");
  try{
    await runTransaction(fs,async t=>{
      const b=(await t.get(ref)).data().bal;
      if(b<a)throw{message:"Solde insuffisant."};
      t.update(ref,{bal:b-a});
      t.set(doc(collection(fs,"withdrawals")),{uid:auth.currentUser.uid,a,m:esc(p),t:D(),ts:Date.now(),s:"En attente"})
    });
    alert("✅ Demande de retrait envoyée !");
    go("histRet");
  }catch(e){err(e.message)}
}
